# tmpfiles.d(5) rules applied only by tmpcleaner.service, never by the
# distribution's own systemd-tmpfiles-clean (this file is not in a tmpfiles.d dir).
#
# A file under /tmp is removed when its access, birth, status-change and
# modification times are all older than 6 hours. A directory is removed when it
# is empty and its birth and modification times are older than 6 hours; its
# access time is ignored, since merely listing it (ls, a --dry-run) renews it.
d /tmp - - - abcmBM:6h

# Never touch these, whatever their age.
x /tmp/.X11-unix
x /tmp/.ICE-unix
x /tmp/.XIM-unix
x /tmp/.font-unix
x /tmp/.Test-unix
x /tmp/.X[0-9]*-lock
x /tmp/systemd-private-*
x /tmp/snap-private-tmp
# MIT Kerberos keeps ticket caches here by default; they outlive six hours.
x /tmp/krb5cc_*
