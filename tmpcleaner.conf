# tmpfiles.d(5) rules applied only by tmpcleaner.service, never by the
# distribution's own systemd-tmpfiles-clean (this file is not in a tmpfiles.d dir).
#
# An entry under /tmp is removed when its access, birth and modification times
# (plus status-change time for files) are all older than 6 hours.
d /tmp - - - 6h

# Never touch these, whatever their age.
x /tmp/.X11-unix
x /tmp/.ICE-unix
x /tmp/.XIM-unix
x /tmp/.font-unix
x /tmp/.Test-unix
x /tmp/.X[0-9]*-lock
x /tmp/systemd-private-*
x /tmp/snap-private-tmp
